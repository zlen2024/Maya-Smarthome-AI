        (function () {
          var ID = "f09-ai-child";

          var timeEl = q(".time");
          var eOut = gsap.parseEase("power3.out");
          var perms = qa(".perm");
          var stEls = perms.map(function (p) { return p.querySelector(".st"); });
          var offAt = [8.75, 9.05];
          var drv = { t: 0 };
          function render(t) {
            var p = eOut(clamp((t - 5.4) / 1.6));
            var mins = Math.round(102 * p);

            ring.style.strokeDashoffset = RLEN * (1 - 0.85 * p);
            stEls[0].textContent = t >= offAt[0] ? "BLOCKED" : "ALLOWED";
            stEls[1].textContent = t >= offAt[1] ? "BLOCKED" : "ALLOWED";
