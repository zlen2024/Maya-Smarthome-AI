        [data-composition-id="f08-demo"] .screen { position: relative; width: 1160px; height: 652px; flex: none; border-radius: 26px; border: 4px solid rgba(10, 10, 10, 0.18); box-shadow: 0 30px 70px rgba(10, 10, 10, 0.22); overflow: hidden; background: #0A0A0A; }

        [data-composition-id="f08-demo"] .beat { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; border: 3px solid rgba(10, 10, 10, 0.12); background: rgba(255, 255, 255, 0.55); box-sizing: border-box; opacity: 0; }

      <div data-hf-id="hf-4r1h" id="root" data-composition-id="f08-demo" data-width="1920" data-height="1080">

                <div data-hf-id="hf-sqkp" class="beat b6 key"><i data-hf-id="hf-zsm9"></i><span data-hf-id="hf-804f">One outlet off, another on · independent control</span></div>

            </div>
          </div>

      <!-- The clip's own sound is mounted at the root in index.html so it joins the voiceover group
           and the music bed ducks under it like any other narration. -->
      <script>
        (function () {
          var ID = "f08-demo";
          var DUR = 38.5;
          var all = document.querySelectorAll('[data-composition-id="' + ID + '"]');
          var R = all[all.length - 1];
          function q(s) { return R.querySelector(s); }
          var tl = gsap.timeline({ paused: true });
          function rise(el, at, o) {
            o = o || {};
            tl.fromTo(el, { opacity: 0, x: o.x || 0, y: o.y == null ? 36 : o.y, scale: o.s || 1 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: o.d || 0.5, ease: o.e || "power3.out" }, at);
          }

          tl.fromTo(q(".stage"), { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 0);
          tl.fromTo(q(".haze"), { x: 0, y: 0 }, { x: -60, y: 30, duration: DUR, ease: "none" }, 0);
          rise(q(".label"), 0.15, { x: -24, y: 0, d: 0.45 });
          rise(q(".h1"), 0.3, { y: 26, d: 0.5 });
          rise(q(".screen"), 0.35, { y: 40, s: 0.98, d: 0.6 });
          rise(q(".note"), 1.2, { y: 14, d: 0.45 });

          // Beat rail — each caption lands on its moment in the recording (clip time + 0.6s lead-in).
          var beats = [0.8, 3.8, 10.8, 16.0, 22.0, 27.5, 33.2];
          beats.forEach(function (t, i) {
            var el = q(".b" + i);
            rise(el, t, { x: 26, y: 0, d: 0.42 });
            tl.fromTo(el.querySelector("i"), { scale: 0.6, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.1);
          });

          window.__timelines["f08-demo"] = tl;
        })();
      </script>
    </template>
